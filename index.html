<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clipador — corte automático com legenda</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg: #14161a;
    --bg-panel: #1c1f24;
    --line: #2a2e35;
    --text: #ecebe6;
    --muted: #8b909a;
    --accent: #ffce33;   /* rec / marker amarelo, vernáculo de timeline */
    --accent-2: #00d7ff; /* mesma cor do highlight de legenda no app */
    --danger: #ff5d5d;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .topbar{
    display:flex; align-items:center; gap:12px;
    padding:18px 28px; border-bottom:1px solid var(--line);
  }
  .topbar .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 0 4px rgba(255,206,51,.12);}
  .topbar h1{
    font-family:'Archivo Black',sans-serif; font-size:15px; letter-spacing:.02em;
    margin:0; text-transform:uppercase;
  }
  .topbar .tc{
    margin-left:auto; font-family:'IBM Plex Mono',monospace; color:var(--muted); font-size:12px;
  }

  .wrap{max-width:760px; margin:0 auto; padding:56px 24px 80px;}
  .hero h2{
    font-family:'Archivo Black',sans-serif; font-size:clamp(28px,5vw,44px);
    line-height:1.05; margin:0 0 14px; letter-spacing:-0.01em;
  }
  .hero h2 span{color:var(--accent);}
  .hero p{color:var(--muted); font-size:15px; max-width:520px; margin:0 0 36px;}

  .panel{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:10px;
    padding:22px;
  }
  .field-label{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--accent-2);
    text-transform:uppercase; letter-spacing:.08em; margin-bottom:8px; display:block;
  }
  .input-row{display:flex; gap:10px;}
  input[type=text]{
    flex:1; background:#101215; border:1px solid var(--line); color:var(--text);
    padding:14px 16px; border-radius:7px; font-size:14px; font-family:'IBM Plex Mono',monospace;
    outline:none;
  }
  input[type=text]:focus{border-color:var(--accent-2);}
  .toggle-row{
    display:flex; align-items:center; gap:10px; margin-top:16px; font-size:13px; color:var(--muted);
  }
  button{
    background:var(--accent); color:#14161a; border:none; padding:14px 22px;
    font-weight:700; font-size:13px; border-radius:7px; cursor:pointer;
    font-family:'Inter',sans-serif; text-transform:uppercase; letter-spacing:.03em;
    transition:filter .15s;
  }
  button:hover{filter:brightness(1.08);}
  button:disabled{opacity:.4; cursor:not-allowed;}

  .progress-zone{margin-top:28px; display:none;}
  .progress-zone.show{display:block;}
  .status-line{
    display:flex; justify-content:space-between; font-family:'IBM Plex Mono',monospace;
    font-size:12px; color:var(--muted); margin-bottom:8px;
  }
  .status-line .status{color:var(--accent-2);}
  .track{
    height:10px; background:#101215; border-radius:6px; overflow:hidden; border:1px solid var(--line);
    position:relative;
  }
  .track-fill{
    height:100%; background:linear-gradient(90deg, var(--accent-2), var(--accent));
    width:0%; transition:width .4s ease;
  }

  .clips{margin-top:36px; display:flex; flex-direction:column; gap:12px;}
  .clip-card{
    display:flex; align-items:center; gap:16px;
    background:var(--bg-panel); border:1px solid var(--line); border-radius:9px; padding:16px 18px;
  }
  .clip-tc{
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--accent-2);
    min-width:118px;
  }
  .clip-info{flex:1;}
  .clip-info .reason{font-size:13px; color:var(--text); margin:0 0 4px;}
  .clip-info .dur{font-size:11px; color:var(--muted); font-family:'IBM Plex Mono',monospace;}
  .clip-card a{
    color:#14161a; background:var(--accent-2); text-decoration:none; padding:9px 14px;
    border-radius:6px; font-size:12px; font-weight:700; text-transform:uppercase;
  }

  .error-box{
    margin-top:20px; border:1px solid var(--danger); color:var(--danger);
    padding:14px 16px; border-radius:8px; font-size:13px; display:none;
  }
  .error-box.show{display:block;}
</style>
</head>
<body>

  <div class="topbar">
    <div class="dot"></div>
    <h1>Clipador</h1>
    <div class="tc" id="clock">00:00:00:00</div>
  </div>

  <div class="wrap">
    <div class="hero">
      <h2>Cole o link.<br>A gente <span>corta</span>, legenda<br>e entrega o clipe.</h2>
      <p>Joga a URL de um vídeo do YouTube. O sistema baixa, transcreve, encontra os melhores
      momentos e devolve clipes cortados com legenda estilo destaque de palavra, prontos pra Reels,
      Shorts e TikTok.</p>
    </div>

    <div class="panel">
      <label class="field-label">Link do YouTube</label>
      <div class="input-row">
        <input type="text" id="url" placeholder="https://www.youtube.com/watch?v=...">
        <button id="submitBtn">Gerar cortes</button>
      </div>
      <div class="toggle-row">
        <input type="checkbox" id="vertical" checked style="accent-color:var(--accent-2)">
        <label for="vertical">Reenquadrar em vertical (9:16) para Shorts/Reels</label>
      </div>
    </div>

    <div class="error-box" id="errorBox"></div>

    <div class="progress-zone" id="progressZone">
      <div class="status-line">
        <span id="statusText">na fila</span>
        <span class="status" id="progressPct">0%</span>
      </div>
      <div class="track"><div class="track-fill" id="trackFill"></div></div>
    </div>

    <div class="clips" id="clipsZone"></div>
  </div>

<script>
const STATUS_LABELS = {
  na_fila: "na fila",
  baixando: "baixando vídeo",
  transcrevendo: "transcrevendo áudio",
  escolhendo_melhores_momentos: "encontrando os melhores momentos",
  cortando: "cortando e legendando",
  concluido: "concluído",
  erro: "erro",
};

const urlInput = document.getElementById('url');
const submitBtn = document.getElementById('submitBtn');
const progressZone = document.getElementById('progressZone');
const statusText = document.getElementById('statusText');
const progressPct = document.getElementById('progressPct');
const trackFill = document.getElementById('trackFill');
const clipsZone = document.getElementById('clipsZone');
const errorBox = document.getElementById('errorBox');

let pollTimer = null;

submitBtn.addEventListener('click', async () => {
  const url = urlInput.value.trim();
  if (!url) return;
  errorBox.classList.remove('show');
  clipsZone.innerHTML = '';
  submitBtn.disabled = true;

  try {
    const res = await fetch('/api/jobs', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({url, vertical: document.getElementById('vertical').checked})
    });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || 'Falha ao criar job');
    }
    const {job_id} = await res.json();
    progressZone.classList.add('show');
    poll(job_id);
  } catch (e) {
    showError(e.message);
    submitBtn.disabled = false;
  }
});

function showError(msg){
  errorBox.textContent = msg;
  errorBox.classList.add('show');
}

function poll(jobId){
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    const res = await fetch(`/api/jobs/${jobId}`);
    const data = await res.json();
    statusText.textContent = STATUS_LABELS[data.status] || data.status;
    progressPct.textContent = `${data.progress || 0}%`;
    trackFill.style.width = `${data.progress || 0}%`;

    if (data.clips && data.clips.length) {
      renderClips(jobId, data.clips);
    }

    if (data.status === 'concluido' || data.status === 'erro') {
      clearInterval(pollTimer);
      submitBtn.disabled = false;
      if (data.status === 'erro') showError(data.error || 'Algo deu errado.');
    }
  }, 2500);
}

function renderClips(jobId, clips){
  clipsZone.innerHTML = clips.map(c => `
    <div class="clip-card">
      <div class="clip-tc">${fmt(c.start)} → ${fmt(c.end)}</div>
      <div class="clip-info">
        <p class="reason">${c.reason || 'Trecho selecionado'}</p>
        <div class="dur">${c.duration}s</div>
      </div>
      <a href="/api/jobs/${jobId}/clips/${c.file}" download>Baixar</a>
    </div>
  `).join('');
}

function fmt(s){
  const m = Math.floor(s/60).toString().padStart(2,'0');
  const sec = Math.floor(s%60).toString().padStart(2,'0');
  return `${m}:${sec}`;
}

// relógio decorativo no topo (timecode-vibe)
setInterval(() => {
  const d = new Date();
  document.getElementById('clock').textContent =
    [d.getHours(), d.getMinutes(), d.getSeconds()].map(n=>String(n).padStart(2,'0')).join(':') + ':00';
}, 1000);
</script>
</body>
</html>
